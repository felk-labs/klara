name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.job }}
    services:
      postgres:
        env:
          POSTGRES_DB: test-klara
          POSTGRES_PASSWORD: klara
          POSTGRES_USER: klara
        image: postgres:18
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Postgres
        run: psql < db/schema.sql
        env:
          PGDATABASE: test-klara
          PGHOST: localhost
          PGPASSWORD: klara
          PGUSER: klara
      - name: Code coverage
        run: make test:coverage
        env:
          PGDATABASE: test-klara
          PGHOST: localhost
          PGPASSWORD: klara
          PGUSER: klara

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint:ci

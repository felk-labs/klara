name: Publish
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag (defaults to the branch name when not running on the default branch)
        required: false
        type: string

jobs:
  imapd:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ${{ github.workflow_ref }}-imapd
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ github.repository }}-imapd
            ghcr.io/${{ github.repository }}-imapd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: .
          file: imapd.containerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  klara:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ${{ github.workflow_ref }}-klara
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: .
          file: Containerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  msa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ${{ github.workflow_ref }}-msa
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ github.repository }}-msa
            ghcr.io/${{ github.repository }}-msa
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: .
          file: msa.containerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  mta:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ${{ github.workflow_ref }}-mta
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ github.repository }}-mta
            ghcr.io/${{ github.repository }}-mta
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: .
          file: mta.containerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  smtpd:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ${{ github.workflow_ref }}-smtpd
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ github.repository }}-smtpd
            ghcr.io/${{ github.repository }}-smtpd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          annotations: ${{ steps.meta.outputs.annotations }}
          context: .
          file: smtpd.containerfile
          platforms: |
            linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  cleanup:
    runs-on: ubuntu-latest
    needs:
      - imapd
      - klara
      - msa
      - mta
      - smtpd
    # Run even when builds fail to remove untagged images pushed by failed runs
    if: ${{ !cancelled() }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        suffix:
          - ""
          - -imapd
          - -msa
          - -mta
          - -smtpd
    steps:
      - name: Extract repo name
        id: repo
        run: echo "name=$(basename ${{ github.repository }})" >> $GITHUB_OUTPUT
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.repo.outputs.name }}${{ matrix.suffix }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true

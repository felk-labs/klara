syntax = "proto3";

package klara.detail;

option go_package = "go.klara.mx/internal/pb";

import "klara/v1/mail.proto";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message Event {
	// Event timestamp
	google.protobuf.Timestamp timestamp = 1;

	// Event attributes
	map<string, string> attrs = 2;

	// Event metadata
	optional google.protobuf.Struct meta = 3;

	// Event data
	oneof data {
		EventDataMail mail = 4;
		EventDataMsg msg = 5;
	}
}

message EventDataMail {
	string id = 1;

	klara.v1.MailType   type   = 2;
	klara.v1.MailStatus status = 3;
}

message EventDataMsg {
	string id         = 1;
	string mailbox_id = 2;
}

syntax = "proto3";

package klara.v1;

option go_package = "go.klara.mx/pb";

service Mailboxes {
	rpc RetrieveMsg(MailboxMsgRetrieveRequest) returns (MailboxMsgRetrieveResponse);
}

message MailboxMsgRetrieveRequest {
	string msg_id  = 1;
	string mbox_id = 2;
}

message MailboxMsgRetrieveResponse {
	MailboxMsg msg = 1;
}

message MailboxMsg {
	string msg_id  = 1;
	string mbox_id = 2;
	uint32 uid     = 3;
	string data    = 4;
}
